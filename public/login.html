<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập — Quản lý Mai Táng Phí</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
<style>
  body { background: #f0f2f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { width: 360px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,.12); }
  .card-header { background: #28a745; color: #fff; text-align: center; font-size: 18px; font-weight: 600; border-radius: 8px 8px 0 0; padding: 18px; }
</style>
</head>
<body>
<div class="card">
  <div class="card-header">🏛️ Quản lý Mai Táng Phí</div>
  <div class="card-body p-4">
    <div id="alert" class="alert alert-danger d-none"></div>
    <div class="form-group">
      <label>Tài khoản</label>
      <input type="text" id="username" class="form-control" placeholder="Tài khoản" autofocus>
    </div>
    <div class="form-group">
      <label>Mật khẩu</label>
      <input type="password" id="password" class="form-control" placeholder="Mật khẩu">
    </div>
    <button class="btn btn-success btn-block mt-3" id="btn-login">Đăng nhập</button>
  </div>
</div>
<script>
function doLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const alert    = document.getElementById('alert');
  alert.classList.add('d-none');
  if (!username || !password) { alert.textContent = 'Vui lòng nhập đủ thông tin'; alert.classList.remove('d-none'); return; }

  fetch('/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password }),
  })
  .then(r => r.json())
  .then(res => {
    if (res.status === 'ok') { window.location.href = res.redirect || '/'; }
    else { alert.textContent = res.msg; alert.classList.remove('d-none'); }
  })
  .catch(() => { alert.textContent = 'Lỗi kết nối server'; alert.classList.remove('d-none'); });
}

document.getElementById('btn-login').addEventListener('click', doLogin);
document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
